<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SimpleGST — Your GST, made simple</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/v2/styles.css">
</head>
<body>
  <a class="skip-link" href="#app">Skip to main content</a>
  <div class="pb" id="scroll-pb" aria-hidden="true"></div>

  <header class="tb">
    <div class="in">
      <button type="button" class="lg" data-go="home" aria-label="SimpleGST Home">SimpleGST</button>

      <nav class="nv" id="nv" aria-label="Primary navigation">
        <i class="ni a" id="nav-active-pill" aria-hidden="true"></i>
        <i class="ni" id="nav-hover-pill" aria-hidden="true"></i>
        <button type="button" data-go="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"/></svg><span>Home</span></button>
        <button type="button" data-go="file"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h8l4 4v14H6zM14 3v4h4M9 13h6M9 17h6"/></svg><span>File GST</span></button>
        <button type="button" data-go="invoices"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16l-3-2-2 2-2-2-2 2-2-2-3 2zM9 9h6M9 13h6"/></svg><span>Invoices</span></button>
        <button type="button" data-go="history"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>History</span></button>
        <button type="button" data-go="copilot"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14v10H10l-5 4z"/></svg><span>Copilot</span></button>
        <button type="button" data-go="experts"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14v-2a8 8 0 0116 0v2M4 14h3v5H4zM17 14h3v5h-3z"/></svg><span>Tax Experts</span></button>
        <button type="button" data-go="startup"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19c0-4 3-8 9-12l4-2-2 4c-4 6-8 9-11 10zM9 15l-3 3"/></svg><span>Start a business</span></button>
        <button type="button" data-go="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/></svg><span>Settings</span></button>
      </nav>

      <div class="rt2">
        <label for="gstin-switcher" class="skip-link">Active GSTIN</label>
        <select id="gstin-switcher" class="gstin-select" aria-label="Select active GSTIN branch" hidden></select>

        <button type="button" class="us" id="user-menu-btn" aria-haspopup="true" aria-expanded="false" hidden>
          <span class="av" id="hdr-avatar">U</span>
          <span class="user-meta">
            <b id="hdr-name">Account</b>
            <span id="hdr-org">Business</span>
          </span>
        </button>

        <div class="user-menu" id="user-menu" role="menu">
          <button type="button" class="menu-item" data-go="settings" role="menuitem">Settings &amp; Branches</button>
          <button type="button" class="menu-item danger" data-act="logout" role="menuitem">Sign out</button>
        </div>
      </div>
    </div>
  </header>

  <main id="app" class="pg" tabindex="-1" aria-live="polite"></main>

  <nav class="mob-nav" aria-label="Mobile navigation">
    <button type="button" class="mob-btn" data-go="home">Home</button>
    <button type="button" class="mob-btn" data-go="file">File GST</button>
    <button type="button" class="mob-btn" data-go="invoices">Invoices</button>
    <button type="button" class="mob-btn" data-act="open-copilot-panel">Copilot</button>
    <button type="button" class="mob-btn" data-go="settings">More</button>
  </nav>

  <button type="button" class="fab" id="copilot-fab" data-act="open-copilot-panel" aria-label="Open GST Copilot">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M5 5h14v10H10l-5 4z"/></svg>
    <span>Copilot</span>
  </button>

  <section class="pn" id="copilot-panel" role="dialog" aria-label="GST Copilot" aria-hidden="true">
    <header>
      <div>
        <strong>GST Copilot</strong>
        <div class="pn-sub num" id="copilot-gstin-label">Deterministic GST Assistant</div>
      </div>
      <button type="button" id="copilot-close-btn" aria-label="Close Copilot">×</button>
    </header>
    <div class="ms" id="copilot-msgs" aria-live="polite"></div>
    <div class="cs">
      <button type="button" data-act="ask-chip" data-q="How much tax do I owe?">Tax to pay?</button>
      <button type="button" data-act="ask-chip" data-q="How much ITC can I claim?">ITC?</button>
      <button type="button" data-act="ask-chip" data-q="Explain my GSTR-3B">GSTR-3B?</button>
    </div>
    <form class="cf" id="copilot-form">
      <label for="copilot-input" class="skip-link">Ask GST Copilot</label>
      <input class="in2" id="copilot-input" type="text" placeholder="Ask Copilot…">
      <button type="submit" class="btn btn-sm">Ask</button>
    </form>
  </section>

  <div class="pal" id="pal" role="dialog" aria-label="Quick navigation palette" aria-hidden="true">
    <div class="pc">
      <label for="pal-input" class="skip-link">Jump to a section or ask Copilot</label>
      <input id="pal-input" placeholder="Jump to a section or ask Copilot… (Esc to close)" autocomplete="off">
      <div id="pal-list"></div>
    </div>
  </div>

  <div class="cu" id="curtain" aria-live="polite"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="/v2/app.js"></script>
</body>
</html>
