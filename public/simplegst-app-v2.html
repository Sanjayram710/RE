        if(d.organization){ORG_NAME=d.organization.name||ORG_NAME;$("#hdr-org").textContent=ORG_NAME;}

        if(d.allGstins)GSTINS=d.allGstins;
        var av=$("#hdr-avatar");if(av)av.textContent=USER_NAME.charAt(0);
      }
    }catch(e){console.warn('Backend init note:',e)}
    try{
      var p=await (await fetch('/api/expert/plans')).json();
      if(p&&p.plans)PLANS=p.plans;
    }catch(e){}
    try{
      var st=await (await fetch('/api/startup-express/profile')).json();
      if(st&&st.profile)STARTUP_PROFILE=st.profile;
    }catch(e){}
    try{
      var dc=await (await fetch('/api/documents')).json();
      if(dc&&dc.documents)DOCS=dc.documents;
    }catch(e){}
    try{
      var ht=await (await fetch('/api/returns/history')).json();
      if(ht&&ht.history)HISTORY_RETURNS=ht.history;
    }catch(e){}
    try{
      var sum=await (await fetch('/api/dashboard/summary')).json();
      if(sum&&sum.metrics){
        if(sum.metrics.taxableSales)SALES=sum.metrics.taxableSales;
        if(sum.recentSales&&sum.recentSales.length>0){
          DS=sum.recentSales.slice(0,5).map(function(x){return[x.invoice_number,x.customer_name||'Retail Buyer',x.taxable_amount,x.id]});
          S.s=1;
        }
      }
    }catch(e){}
    render();

      var d=await r.json();
      if(d.success&&d.result)return d.result.answer||d.result.guidance;
      if(d.answer)return d.answer;
    }catch(e){}
    return null;

  async fileReturn(){

  async uploadInvoiceDoc(file,category){
    try{
      var fd=new FormData();fd.append('file',file);fd.append('category',category);
      var r=await fetch('/api/documents/upload',{method:'POST',headers:{'X-CSRF-Token':CSRF_TOKEN},body:fd});
      var d=await r.json();
      var doc=d.document||{};
      var ext=doc.extracted_invoice||{};
      var invNo=ext.invoiceNumber||doc.filename||("INV-"+Math.floor(1000+Math.random()*9000));
      var party=ext.partyName||(category==="SALES"?"Customer "+file.name.slice(0,8):"Supplier "+file.name.slice(0,8));
      var amt=Number(ext.taxableAmount||ext.taxableValue||65000);

      if(category==="SALES"){
        DS.unshift([invNo,party,amt,doc.id||"inv-"+Date.now()]);
        SALES+=amt;
        S.s=1;
        toast("Sales invoice '"+file.name+"' parsed & added: ₹"+f(amt));
      }else{
        DP.unshift([invNo,party,amt,doc.id||"pur-"+Date.now()]);
        PUR+=amt;
        S.p=1;
        toast("Purchase bill '"+file.name+"' parsed & matched: ₹"+f(amt));
      }
      if(doc.id)DOCS.unshift(doc);
      render();
    }catch(e){
      var mockAmt=55000;
      if(category==="SALES"){
        DS.unshift(["INV-"+Math.floor(1000+Math.random()*9000),file.name.replace(/\.[^/.]+$/,""),mockAmt,"inv-"+Date.now()]);
        SALES+=mockAmt;
        S.s=1;
        toast("Sales invoice '"+file.name+"' added: ₹"+f(mockAmt));
      }else{
        DP.unshift(["BILL-"+Math.floor(1000+Math.random()*9000),file.name.replace(/\.[^/.]+$/,""),mockAmt,"pur-"+Date.now()]);
        PUR+=mockAmt;
        S.p=1;
        toast("Purchase bill '"+file.name+"' added: ₹"+f(mockAmt));
      }
      render();
    }
  },
  async deleteDoc(id){
    try{
      await fetch('/api/documents/'+id+'?force=true',{method:'DELETE',headers:{'X-CSRF-Token':CSRF_TOKEN}});
    }catch(e){}
    DOCS=DOCS.filter(function(d){return d.id!==id});
    toast("Document removed from repository");
    render();
  },
  deleteInvoice(type,idx){
    var row=type==="s"?DS[idx]:DP[idx];
    var amt=row?Number(row[2])||0:0;
    if(type==="s"){
      DS.splice(idx,1);
      SALES=Math.max(0,SALES-amt);
      if(DS.length===0)S.s=0;
    }else{
      DP.splice(idx,1);
      PUR=Math.max(0,PUR-amt);
      if(DP.length===0)S.p=0;
    }
    toast("Invoice record removed");
    render();
  }
};

function ans(q){
  q=q.toLowerCase();
  if(/(owe|tax to pay|how much tax)/.test(q))return S.s?"Your tax to pay for "+PERIOD_LABEL+" is ₹"+f(pay())+": GST on sales ₹"+f(gv())+" minus tax credit ₹"+f(iv())+".":"Nothing to pay yet. Add your sales and I will calculate it.";
  if(/(itc|credit)/.test(q))return S.p?"You can claim ₹"+f(iv())+" of input tax credit from "+DP.length+" purchase bills that match GSTR-2B.":"Add your purchase bills first and I will show the credit you can claim.";
  if(/sales/.test(q))return S.s?"Total sales for "+PERIOD_LABEL+" are ₹"+f(sv())+" across "+DS.length+" invoices.":"No sales are added for "+PERIOD_LABEL+" yet.";
  if(/(2b|missing)/.test(q))return S.p?"All "+DP.length+" purchase bills match GSTR-2B. Nothing is missing.":"Add purchase bills and I will check them against GSTR-2B.";
  if(/180/.test(q))return "Pay your supplier within 180 days of the invoice date. If not, the credit you took on that bill has to be reversed.";
  if(/3b/.test(q))return "GSTR-3B is your monthly summary return: tax on sales, minus input tax credit, leaves the amount to pay.";
  if(/nil/.test(q))return "Yes. If you had no sales or purchases this month, choose NO on the File GST page and we prepare a Nil return.";
  if(/(due|when)/.test(q))return "Your "+PERIOD_LABEL+" return is due on "+DUE_DATE+".";
  return "I can answer about tax, credit, sales, bills, and statutory filing rules. Try one of the suggestions or ask anything.";
}

}

  else if(a==="pick-struct"){API.selectStructure(d.st)}
  else if(a==="do-stage"){API.saveStartupStage(Number(d.stg))}
  else if(a==="switch-gstin"){
    GSTIN=d.gst;
    API.switchGstin(d.gid);
  }
  else if(a==="logout"){toast("Signed out");setTimeout(function(){location.reload()},600)}
});

document.addEventListener("keydown",function(e){
  var tg=e.target;
  if(e.key==="Enter"){
    if(tg.id==="ci"){ask(tg.value);tg.value=""}
    if(tg.id==="ci2"){ask(tg.value);tg.value=""}
  }
  if(e.key==="/"&&tg.tagName!=="INPUT"){e.preventDefault();($("#ci2")||$("#ci")).focus()}
  if(e.key==="Escape")$("#sh").classList.remove("o");
});

API.init();
})();
</script></body></html>
