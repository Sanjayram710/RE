<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SimpleGST — Your GST, made simple</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/v2/styles.css">
</head>
<body>
  <a class="skip-link" href="#app">Skip to main content</a>

  <header class="topbar">
    <div class="wrap topbar-inner">
      <button type="button" class="brand" data-go="home" aria-label="SimpleGST Home">SimpleGST</button>

      <nav class="nav-pill" aria-label="Primary navigation">
        <button type="button" class="nav-btn" data-go="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"/></svg><span>Home</span></button>
        <button type="button" class="nav-btn" data-go="file"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h8l4 4v14H6zM14 3v4h4M9 13h6M9 17h6"/></svg><span>File GST</span></button>
        <button type="button" class="nav-btn" data-go="invoices"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16l-3-2-2 2-2-2-2 2-2-2-3 2zM9 9h6M9 13h6"/></svg><span>Invoices</span></button>
        <button type="button" class="nav-btn" data-go="history"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>History</span></button>
        <button type="button" class="nav-btn nav-copilot" data-act="toggle-copilot"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14v10H10l-5 4z"/></svg><span>Copilot</span></button>
        <button type="button" class="nav-btn" data-go="experts"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14v-2a8 8 0 0116 0v2M4 14h3v5H4zM17 14h3v5h-3z"/></svg><span>Tax Experts</span></button>
        <button type="button" class="nav-btn" data-go="startup"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19c0-4 3-8 9-12l4-2-2 4c-4 6-8 9-11 10zM9 15l-3 3"/></svg><span>Start a business</span></button>
        <button type="button" class="nav-btn" data-go="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/></svg><span>Settings</span></button>
      </nav>

      <div class="topbar-right">
        <label for="gstin-switcher" class="skip-link">Active GSTIN</label>
        <select id="gstin-switcher" class="gstin-select" aria-label="Select active GSTIN branch" hidden></select>

        <button type="button" class="user-btn" id="user-menu-btn" aria-haspopup="true" aria-expanded="false" hidden>
          <span class="avatar" id="hdr-avatar">U</span>
          <span class="user-meta">
            <b id="hdr-name">Account</b>
            <small id="hdr-org">Business</small>
          </span>
        </button>

        <div class="user-menu" id="user-menu" role="menu">
          <button type="button" class="menu-item" data-go="settings" role="menuitem">Settings &amp; Branches</button>
          <button type="button" class="menu-item danger" data-act="logout" role="menuitem">Sign out</button>
        </div>
      </div>
    </div>
  </header>

  <main id="app" class="wrap pg" tabindex="-1" aria-live="polite"></main>

  <nav class="mob-nav" aria-label="Mobile navigation">
    <button type="button" class="mob-btn" data-go="home">Home</button>
    <button type="button" class="mob-btn" data-go="file">File GST</button>
    <button type="button" class="mob-btn" data-go="invoices">Invoices</button>
    <button type="button" class="mob-btn" data-act="toggle-copilot">Copilot</button>
    <button type="button" class="mob-btn" data-go="settings">More</button>
  </nav>

  <div class="drawer-backdrop" id="copilot-backdrop"></div>
  <aside class="drawer" id="copilot-drawer" aria-label="GST Copilot Panel" aria-hidden="true">
    <div class="drawer-hdr">
      <div>
        <strong>GST Copilot</strong>
        <div class="num" id="copilot-gstin-label">Deterministic GST Assistant</div>
      </div>
      <button type="button" class="drawer-close" id="copilot-close-btn" aria-label="Close Copilot">✕</button>
    </div>
    <div class="drawer-msgs" id="copilot-msgs" aria-live="polite"></div>
    <form class="drawer-form" id="copilot-form">
      <label for="copilot-input" class="skip-link">Ask GST Copilot</label>
      <input id="copilot-input" type="text" placeholder="Ask about your tax, ITC, or due date...">
      <button type="submit" class="btn">Ask</button>
    </form>
  </aside>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/v2/app.js"></script>
</body>
</html>
